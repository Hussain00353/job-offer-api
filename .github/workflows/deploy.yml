name: CI/CD Pipeline
on:
  push:
    branches:
      - main
permissions:
  contents: read
  actions: write
jobs:
  # CI JOB
  test:
    name: CI - Run Tests & Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install django djangorestframework requests boto3 pytest python-dotenv pytest-cov gunicorn django-csp django-permissions-policy

      - name: Run tests with coverage
        run: |
          python -m pytest tests/test_analyser.py -v --tb=short \
            --cov=analyser \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: jobofferapi.settings
          PYTHONPATH: .
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Fix coverage paths for SonarCloud
        run: |
          sed -i 's|<source>.*</source>|<source>analyser</source>|g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # CD - ZAP SCAN
  zap-scan:
    name: CD - ZAP Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: |
          sudo chown -R 1000:1000 .

      - name: Run ZAP Security Scan
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            -v $(pwd):/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://job-offer-env.eba-svyaknhk.us-east-1.elasticbeanstalk.com \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: |
            zap-report.html
            zap-report.json
            zap-report.md